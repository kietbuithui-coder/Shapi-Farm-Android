name: Build Android APK from Game ZIP

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag cua release chua ZIP nguon"
        required: true
        default: "apk-source-3.6"

permissions:
  contents: write

jobs:
  build-apk:
    name: Unpack, bundle assets and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout APK builder
        uses: actions/checkout@v4

      - name: Resolve release tag
        env:
          RELEASE_TAG_EVENT: ${{ github.event.release.tag_name }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          TAG="${RELEASE_TAG_EVENT:-$RELEASE_TAG_INPUT}"
          test -n "$TAG"
          echo "SOURCE_RELEASE=$TAG" >> "$GITHUB_ENV"

      - name: Download source ZIP from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/game-zip"
          gh release download "$SOURCE_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern '*.zip' --dir "$RUNNER_TEMP/game-zip"
          count=$(find "$RUNNER_TEMP/game-zip" -maxdepth 1 -type f -name '*.zip' | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::Release phai co dung 1 ZIP ma nguon game (da kem Android)."
            exit 1
          fi
          echo "GAME_ZIP=$(find "$RUNNER_TEMP/game-zip" -maxdepth 1 -type f -name '*.zip' | head -n 1)" >> "$GITHUB_ENV"

      - name: Verify exact uploaded game version
        run: |
          echo "89eb73049c02407cb545b7667e1e3902fa478b873e18f8cfcdec5e32977dec0a  $GAME_ZIP" | sha256sum --check --status || {
            echo "::error::ZIP khong trung ban Android 3.6 da kiem tra. Hay upload dung tep game da gui trong chat."
            exit 1
          }
          unzip -tq "$GAME_ZIP" >/dev/null
          mkdir game-source
          unzip -q "$GAME_ZIP" -d game-source
          test -f game-source/android/app/build.gradle
          test -f game-source/scripts/prepare-android-bundle.py
          test -f game-source/public/android-assets-version.txt
          python3 game-source/scripts/prepare-android-bundle.py --verify

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK with bundled assets
        run: gradle --no-daemon -p game-source/android assembleDebug

      - name: Verify signature and package
        run: |
          APK="game-source/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          python3 - <<'PY'
          import zipfile
          apk = 'game-source/android/app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as z:
              assets = [name for name in z.namelist() if name.startswith('assets/web/assets/')]
              marker = z.read('assets/bundle-version.txt').decode().strip()
              assert len(assets) >= 300, f'Bundled assets missing: {len(assets)}'
              assert marker.startswith('shapi-3.6-'), marker
              print(f'APK contains {len(assets)} local asset files, marker: {marker}')
          PY

      - name: Attach APK directly to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$SOURCE_RELEASE"             game-source/android/app/build/outputs/apk/debug/app-debug.apk             --repo "$GITHUB_REPOSITORY" --clobber

      - name: Backup APK in Actions artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Shapi-Farm-3.6-Android-debug-APK
          path: game-source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 30
